[package]
name = "obehy-rt"
description = "The realtime worker binary: the shell, storage, archive and commands."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "obehy-rt"
path = "src/main.rs"

[dependencies]
obehy-core.workspace = true
obehy-sources.workspace = true
clap.workspace = true
arrow-array.workspace = true
arrow-schema.workspace = true
bytes.workspace = true
parquet.workspace = true
prost.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "time", "sync", "signal"] }
tokio-postgres.workspace = true
flate2.workspace = true
hyper.workspace = true
reqwest.workspace = true
sha2.workspace = true
toml.workspace = true
zstd.workspace = true
cpu-time.workspace = true
indexmap.workspace = true
rustc-hash.workspace = true
thiserror.workspace = true
futures-util.workspace = true
memory-stats.workspace = true
mimalloc = { workspace = true, optional = true }

[features]
# The global allocator (`obehy_rt::ALLOCATOR`); without it the system allocator.
mimalloc = ["dep:mimalloc"]

[lints]
workspace = true

[dev-dependencies]
stats_alloc.workspace = true
tokio = { workspace = true, features = ["net", "io-util"] }
