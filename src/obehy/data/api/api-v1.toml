# Project API limits (src/obehy/api, BASE_PLAN.md section 30). Versioned like the realtime
# policy: a change of meaning is a new file.
api_version = "1"

[stops]
# Name search: at least this many characters, at most this many results.
search_min_chars = 2
search_limit = 20
search_limit_max = 50
# Viewport queries: the largest bbox in square degrees (about a district) and the most stops.
bbox_max_deg2 = 0.5
bbox_limit = 2000
# Stops near a point: the default and largest radius in metres, and the most stops.
near_radius_m = 500
near_radius_max_m = 3000
near_limit = 50

[departures]
# A departure scheduled up to this long before `from` stays on the board while it is still to
# come (a late bus).
lookback_min = 90
minutes = 60
minutes_max = 360
limit = 40
limit_max = 200
# A board of several stop places at once takes at most this many.
stops_max = 10

[vehicles]
# Positions older than this are not shown (the realtime policy's default stale_after_s).
max_age_s = 300
bbox_max_deg2 = 4.0
limit = 3000
# Search by line, train number, headsign, fleet number or plate: the most vehicles answered.
search_limit = 20
search_limit_max = 50

[lines]
search_limit = 20
search_limit_max = 50
# The most distinct stop sequences shown for a line.
patterns = 20

[history]
# The longest span of service dates one history or punctuality request covers.
max_days = 21
default_days = 7
# A departure counts as on time from on_time_early_s before to on_time_late_s after schedule.
on_time_early_s = -60
on_time_late_s = 179

[alerts]
# The most alerts one answer lists (a stop place, a line, a board, or all current ones).
limit = 200

[compositions]
# An answer of the lookup broker is shown as fresh this long; then it is asked again (the
# broker reuses its upstream answer while the source's ttl holds). Asked and pending: answered
# 202 with this Retry-After.
fresh_s = 300
retry_after_s = 3

[debug]
window_min = 60
limit = 50

[cache]
# Cache-Control max-age: realtime answers follow the worker's 10 s tick, static ones the
# hourly release update (with the release as ETag).
realtime_s = 5
static_s = 3600
