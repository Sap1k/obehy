# Serves the feeds from the data volume over plain HTTP to the reverse proxy in front, which
# owns TLS and the hostname. Every feed has a stable name under /get-feeds/, served from the
# active release (data/releases/active) or the worker's output; the list page and feeds.json
# come from `obehy release feed-list`.
server {
    listen 80;
    server_tokens off;

    # About 100 Mbit/s per download (bytes per second).
    limit_rate 12500k;

    gzip on;
    gzip_types application/json application/x-protobuf;

    # try_files, not alias: for a URI ending in "/" nginx would append index.html to the alias
    # and fail with a 500 on the not-a-directory path.
    location = /get-feeds/ {
        root /srv/public;
        try_files /index.html =404;
        add_header Cache-Control "no-cache";
    }
    location = /get-feeds/feeds.json {
        alias /srv/public/feeds.json;
        add_header Cache-Control "no-cache";
    }
    location = /get-feeds/cz-jdf-gtfs.zip {
        alias /srv/releases/active/jdf/gtfs.zip;
    }
    location = /get-feeds/cz-jdf-filtered-gtfs.zip {
        alias /srv/releases/active/jdf-filtered/gtfs.zip;
    }
    location = /get-feeds/cz-czptt-gtfs.zip {
        alias /srv/releases/active/czptt/gtfs.zip;
    }
    location = /get-feeds/cz-jdf-gtfs-rt.pb {
        alias /srv/gtfs-rt/jdf.pb;
        default_type application/x-protobuf;
        add_header Cache-Control "no-cache";
    }
    location / {
        return 404;
    }
}
