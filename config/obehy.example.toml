schema_version = 1

[paths]
workdir = "D:/obehy-work"
artifact_root = "D:/obehy-data/artifacts"
osm_file = "D:/obehy-data/osm/obehy-region.osm.pbf"
jrunify_ext_geodata_dir = "D:/src/jrunify-ext-geodata"
# Routed post-inference evidence reused across runs (default: <workdir>/cache/routing).
# routing_cache_dir = "D:/obehy-work/cache/routing"
# Route shapes (BASE_PLAN.md section 17): the obehy-motis-shapes binary; without it the build
# makes no route shapes. Its routing PBF, graph and results go to route_shapes_cache_dir
# (default: <workdir>/cache/route-shapes).
# route_shapes_companion = "D:/tools/obehy-motis-shapes.exe"
# route_shapes_cache_dir = "D:/obehy-work/cache/route-shapes"

[jrutil]
directory = "D:/src/jrutil"
# Alternatively, remove directory and use:
# command = ["dotnet", "D:/tools/jrutil-multitool.dll"]

# Release mirror database (obehy db / obehy release). OBEHY_DATABASE_URL overrides it.
# [database]
# url = "postgresql://obehy:PASSWORD@localhost:45873/obehy"
# Admin database for tests/db (OBEHY_TEST_DATABASE_URL overrides it); the server may be remote.
# test_url = "postgresql://obehy:PASSWORD@localhost:45873/obehy_test"

# Proxied, anonymous egress for SŽ (docs/R2_SLICE.md section 7). Secret: keep it out of git.
# A saved list of ip:port:username:password lines; OBEHY_EGRESS_SZ_PROXY_LIST_FILE overrides it.
# [realtime.egress.sz]
# proxy_list_file = "D:/secrets/sz-proxies.txt"
