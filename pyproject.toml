[project]
name = "obehy"
version = "0.1.0"
description = "Czech public-transport static feed builds and publication"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.149,<1",
  "gtfs-realtime-bindings>=3.0.0",
  "psycopg[binary,pool]>=3.3,<4",
  "pyarrow>=25,<26",
  "rich>=14,<15",
  "shapely>=2.1,<3",
  "uvicorn[standard]>=0.54,<1",
]

[project.scripts]
obehy = "obehy.cli:main"
obehy-osm = "obehy.osm_snapshot:main"

[dependency-groups]
dev = [
  "httpx2>=2.15,<3",
  "import-linter>=2.15",
  "pyarrow-stubs>=20,<21",
  "pyright>=1.1.403,<2",
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/obehy"]

[tool.hatch.build.targets.wheel.force-include]
"src/obehy/data/api" = "obehy/data/api"
"src/obehy/data/post-inference" = "obehy/data/post-inference"
"src/obehy/data/realtime" = "obehy/data/realtime"
"src/obehy/data/serving" = "obehy/data/serving"
"src/obehy/data/stops" = "obehy/data/stops"

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
markers = ["postgres: needs OBEHY_TEST_DATABASE_URL (skipped without it)"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "DTZ"]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "strict"
include = ["src", "tests"]
exclude = ["converters"]

[tool.importlinter]
root_package = "obehy"
include_external_packages = true

# The realtime worker is the Rust binary obehy-rt (rust/, docs/RUST_PORT.md); its crates' own
# dependency direction is checked by rust/obehy-rt/tests/dependency_direction.rs. What stays
# Python of the realtime side reads what it leaves: the database, the output stream, the files.
[[tool.importlinter.contracts]]
name = "The realtime config and diagnostics are pure: no database, network or release side"
type = "forbidden"
source_modules = [
    "obehy.realtime_config",
    "obehy.realtime.disk_guard",
    "obehy.realtime.evaluate",
    "obehy.realtime.journey_view",
    "obehy.realtime.keyless_report",
    "obehy.realtime.names",
    "obehy.realtime.quality",
    "obehy.realtime.quality_checks",
]
forbidden_modules = [
    "psycopg",
    "urllib",
    "asyncio",
    "obehy.api",
    "obehy.release",
    "obehy.pipeline",
]

[[tool.importlinter.contracts]]
name = "The API reads the database only: nothing of the realtime side but its config"
type = "forbidden"
source_modules = ["obehy.api"]
forbidden_modules = ["obehy.realtime", "obehy.pipeline"]

[[tool.importlinter.contracts]]
name = "The replay diagnostics read the output stream: no database, API or release side"
type = "forbidden"
source_modules = [
    "obehy.realtime.replay_report",
    "obehy.realtime.gtfs_rt_check",
    "obehy.realtime.jsonl",
]
forbidden_modules = ["psycopg", "obehy.api", "obehy.release", "obehy.realtime.jobs"]

[[tool.importlinter.contracts]]
name = "Reference datasets are files and SQL: no realtime or API"
type = "forbidden"
source_modules = ["obehy.reference"]
forbidden_modules = ["obehy.realtime", "obehy.api"]
