# JDF calendar designations: the days a trip runs, as printed on the timetable. The calendar
# itself is already compiled into the service dates; these are for display.
[calendar]
"X" = { cs = "jede v pracovních dnech", en = "runs on working days" }
"+" = { cs = "jede v neděli a ve státem uznané svátky", en = "runs on Sundays and public holidays" }
"1" = { cs = "jede v pondělí", en = "runs on Mondays" }
"2" = { cs = "jede v úterý", en = "runs on Tuesdays" }
"3" = { cs = "jede ve středu", en = "runs on Wednesdays" }
"4" = { cs = "jede ve čtvrtek", en = "runs on Thursdays" }
"5" = { cs = "jede v pátek", en = "runs on Fridays" }
"6" = { cs = "jede v sobotu", en = "runs on Saturdays" }
"7" = { cs = "jede v neděli", en = "runs on Sundays" }

# GTFS pickup_type / drop_off_type, as JrUtil projects them.
[boarding]
"0" = "regular"
"1" = "none"
"2" = "phone"
"3" = "ask_driver"

# Integrated transport systems by their CIS JŘ code: the MHD list
# (https://www.cisjr.cz/doc/mhd.htm) as is, and the IDS list
# (https://www.cisjr.cz/doc/ids.htm) at 30000 + its code (the MHD list itself has IDS JMK as
# 30621 = 30000 + 621). 30001 (MHD Praha) is PID. Codes in neither list stay bare.
[integrated_transport]
"30001" = { name = "MHD Praha", abbreviation = "PID" }
"30004" = { name = "MHD České Budějovice" }
"30005" = { name = "MHD Olomouc" }
"30007" = { name = "MHD Plzeň" }
