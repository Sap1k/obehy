"30018" = { name = "MHD Třinec" }
"30023" = { name = "MHD Havířov" }
"30028" = { name = "MHD Žďár nad Sázavou" }
"30036" = { name = "MHD Karlovy Vary" }
"30039" = { name = "MHD Chomutov a Jirkov" }
"30041" = { name = "MHD Jihlava" }
"30044" = { name = "MHD Ústí nad Labem" }
"30065" = { name = "MHD Litomyšl" }
"30069" = { name = "MHD Jáchymov" }
"30071" = { name = "MHD Velké Meziříčí" }
"30091" = { name = "MHD Ostrov" }
"30111" = { name = "Pražská integrovaná doprava", abbreviation = "PID" }
"30209" = { name = "MHD Duchcov" }
"30211" = { name = "MHD Kadaň" }
"30212" = { name = "MHD Klášterec nad Ohří" }
"30220" = { name = "MHD Nové Město na Moravě" }
