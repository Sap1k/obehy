# Project API limits (src/obehy/api, BASE_PLAN.md section 30). Versioned like the realtime
# policy: a change of meaning is a new file.
api_version = "1"

[queries]
# A query running longer is cancelled and the request answers 503: a slow plan must not pile
# up behind clients that poll (the browser gives up, PostgreSQL would not).
statement_timeout_s = 20

[stops]
# Name search: at least this many characters, at most this many results.
search_min_chars = 2
search_limit = 20
search_limit_max = 50
# Viewport queries: the largest bbox in square degrees (about a district) and the most stops.
bbox_max_deg2 = 0.5
bbox_limit = 2000
# Stops near a point: the default and largest radius in metres, and the most stops.
near_radius_m = 500
near_radius_max_m = 3000
near_limit = 50

[departures]
# A departure scheduled up to this long before `from` stays on the board while it is still to
# come (a late bus).
lookback_min = 90
# A board without a window asked looks this far ahead, and up to minutes_max when that does not
# fill its page (a quiet stop's next departures are hours away).
minutes = 90
minutes_max = 360
limit = 40
limit_max = 200
# A board of several stop places at once takes at most this many.
stops_max = 10

[vehicles]
# Positions older than this are not shown (the realtime policy's default stale_after_s).
max_age_s = 300
# A viewport is one cell of the clients' grid (web/src/features/map/grid.ts, the app's
# VehicleGrid.kt): a 1, 1/2 or 1/4 degree square on its own multiple, spelled as they spell it
# ("14.25,50.5,14.5,50.75"), with its south-west corner in this area (west, south, east, north).
# Every viewer asks for the same few hundred URLs, which the caches in front then answer.
grid = [11, 48, 20, 52]
limit = 3000
# Search by line, train number, headsign, fleet number or plate: the most vehicles answered.
search_limit = 20
search_limit_max = 50

[lines]
search_limit = 20
search_limit_max = 50
# The most distinct stop sequences shown for a line.
patterns = 20

[history]
# The longest span of service dates one history or punctuality request covers.
max_days = 14
# By default all of it: as long as history keeps (realtime policy `[retention] history_days`).
default_days = 14

[trips]
# A call without realtime saying so counts as passed this long after its (expected) time.
passed_after_s = 30

[punctuality]
# Bands of a delay in shown minutes (expected minus scheduled, each cut to the minute): early up
# to early_max_min, on time up to on_time_max_min, late up to late_max_min, very late beyond.
# Every answer's `punctuality` and history's on-time shares use them (api/punctuality.py).
early_max_min = -2
on_time_max_min = 2
late_max_min = 9

[alerts]
# The most alerts one answer lists (a stop place, a line, a board, or all current ones).
limit = 200

[compositions]
# An answer of the lookup broker is shown as fresh this long; then it is asked again (the
# broker reuses its upstream answer while the source's ttl holds). Asked and pending: answered
# 202 with this Retry-After.
fresh_s = 300
retry_after_s = 3

[journeys]
# Legs of MOTIS itineraries enriched in one request (a page of itineraries, every transit leg).
enrich_legs_max = 60

[debug]
window_min = 60
limit = 50

[cache]
# Realtime answers follow the worker's 10 s tick: the reverse proxy and Cloudflare keep them this
# long (X-Accel-Expires, CDN-Cache-Control), browsers not at all. Static ones follow the hourly release update
# (Cache-Control max-age, with the release as ETag).
realtime_s = 5
static_s = 3600
