# Realtime core policy (BASE_PLAN.md section 23, docs/R1_SLICE.md section 4).
# Every value is required; code holds no defaults. Per-mode tables need a `default` entry and
# may override it per route mode (bus, trolleybus, tram, metro, rail, water, cable, funicular).
policy_version = "1"

[time]
# Date window of a keyed observation: [scheduled start - pre_trip, scheduled end + max_delay].
pre_trip_s = { default = 3600 }
max_delay_s = { default = 7200, rail = 14400 }
vehicle_day_gap_s = 10800
max_clock_skew_s = 1200

[lifecycle]
stale_after_s = 180
off_route_base_m = { default = 400, tram = 150, trolleybus = 150, metro = 150 }
off_route_k = 0.15
off_route_hold_s = 180
backtrack_tolerance_m = 80
arrival_radius_m = 60
departure_margin_m = 40
finished_grace_s = 300

[delay]
discard_below_s = -1800

[warm_replay]
hours = 4

[emit]
tick_s = 10
