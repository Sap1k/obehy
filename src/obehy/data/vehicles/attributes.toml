# The closed vocabulary of vehicle attributes (BASE_PLAN.md section 27). Connectors and the
# reference importers map their fields onto it; a field without a home is kept as
# `raw:<source>:<field>`. Values are text: `true`/`false` for bool, digits for int.
attributes_version = "1"

# A live value seen again is written (its last_seen moved) at most this often.
touch_s = 3600

# Who wins when statements about one vehicle clash. A curated value (the registry) always
# wins; then a live one, from the source listed first (per attribute where that attribute
# names its own order, else `live_sources`; unlisted sources after), the most recent first
# among equals; then the model's default. Every disagreement is flagged, none is dropped.
# Two sources' reports are one vehicle only when the registry binds both to it.
[precedence]
live_sources = ["pid", "duk", "dpmd", "mpvnet", "arriva-express", "sz-mapa", "sz-tabule"]

[precedence.attributes]
# Golemio's agency_name.real is the operator actually running the trip.
operator = ["pid"]

# The identifiers a vehicle can be known by beside a source's vehicle ID: a registry key of
# this kind binds any source report stating the same value live (an MPVnet plate, a 55p series
# number). How each is compared: `letters_digits` (upper case) or `digits`.
[identifiers]
licence_plate = "letters_digits"
evn = "digits"
series_number = "digits"

# Two sources' reports of one journey running side by side are one vehicle while the evidence
# holds, even unregistered (`bound_by = co_located`); each pairing is also a candidate key for
# the registry. Close: fixes at most `max_fix_gap_s` apart, within `distance_m`; confirmed after
# `confirm_s` and `min_fixes` such fixes; dropped when apart by `apart_m`, or `hold_s` after the
# last close fix.
[pairing]
distance_m = 250
apart_m = 1000
max_fix_gap_s = 60
min_fixes = 3
confirm_s = 120
hold_s = 3600

