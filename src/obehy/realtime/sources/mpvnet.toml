# MPV net regional vehicle maps (docs/sources/mpvnet.md). One portal per channel, same payload.
# The bounding box is fixed to the whole country: the portal returns its whole fleet anyway
# (MPVNET-Q1). Buses go to jdf, trains to czptt. Buses are live since 2026-10-12; trains are not
# (`live_feeds = ["jdf"]`) until their positions prove to be GPS (MPVNET-Q8).
source = "mpvnet"
manifest_version = 1
# The public feed list (obehy release feed-list) names the source by these.
title = "MPV net regional vehicle maps"
covers = "Vehicles of IDOL (Liberecký kraj), JIKORD (Jihočeský kraj), ODIS (Moravskoslezský kraj) and IDZK (Zlínský kraj): positions and delays."

# IDOL, Liberecký kraj
[[channel]]
name = "idol"
poll = { kind = "interval", seconds = 15 }
backoff = { after_failures = 5, max_s = 300 }
timeout_s = 10
feeds = ["jdf", "czptt"]
live_feeds = ["jdf"]
capabilities = ["vehicle_key", "trip_key", "position", "delay"]
semantics = { clock = "source", delay_reference = "unknown", key_namespaces = { jdf = "cis:line_trip", czptt = "czptt:train_number" } }

[channel.request]
method = "POST"
url = "https://www.mpvnet.cz/idol/map/mapData"
body = '{"w":12.0,"s":48.5,"e":19.0,"n":51.1,"zoom":10,"showStops":false,"mapFilterId":null}'
headers = { content-type = "application/json; charset=UTF-8", origin = "https://www.mpvnet.cz" }

