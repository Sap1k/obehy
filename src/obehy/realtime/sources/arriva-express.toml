# Arriva bus positions (docs/sources/arriva-express.md). The endpoint returns Arriva's whole
# fleet and takes no arguments; the filter keeps only Arriva Express. No trip key: bound by
# keyless inference (`infer/keyless`). Live on jdf since 2026-10-12, after two captures replayed
# with every episode that shows a departure bound to its trip.
source = "arriva-express"
manifest_version = 1

[[channel]]
name = "buses"
poll = { kind = "interval", seconds = 30 }
backoff = { after_failures = 5, max_s = 300 }
timeout_s = 25
filter = "arriva-express"
feeds = ["jdf"]
live_feeds = ["jdf"]
capabilities = ["vehicle_key", "line_ref", "destination", "next_stop", "position", "delay"]

[channel.semantics]
clock = "source"
delay_reference = "departure"  # ARRIVA-Q3: at the departure from the stop before the next one
delay_floor_minute = true  # ARRIVA-Q3

[channel.request]
method = "POST"
url = "https://www.arriva.cz/api/graphql"
body = '[{"query":"query busesCurrentLocation { busesCurrentLocations { angle delay destinationName lastStopName latitude longitude linkNumber state type mainType spz updated linkNumberAlias } }","operationName":"busesCurrentLocation","variables":{}}]'

[channel.request.headers]
content-type = "application/json"
x-enviroment = "client"
origin = "https://www.arriva.cz"
referer = "https://www.arriva.cz/cs/dopravni-info/aktualni-poloha-autobusu-online"
