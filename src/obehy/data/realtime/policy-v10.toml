# Realtime core policy (BASE_PLAN.md section 23, docs/R1_SLICE.md section 4,
# docs/R2_SLICE.md section 8; v3 adds [keyless], v4 off-path lateness,
# v5 the index sweep and daily compaction, v6 warm replay by vehicle, v7 PID in the position
# preference, v8 two days of rt.observation, v9 the raw archive window, v10 trip updates
# kept after the trip ends, observed dwell credited at stops without a timetabled one, and
# the distance driven followed where a shape misses the road).
# Every value is required; code holds no defaults. Per-mode tables need a `default` entry and
# may override it per route mode (bus, trolleybus, tram, metro, rail, water, cable, funicular).
policy_version = "10"

[time]
# Date window of a keyed observation: [scheduled start - pre_trip, scheduled end + max_delay].
pre_trip_s = { default = 3600 }
max_delay_s = { default = 7200, rail = 14400 }
vehicle_day_gap_s = 10800
max_clock_skew_s = 1200

[lifecycle]
# Without observations a journey's vehicle position is withdrawn (and another vehicle claiming
# the journey may take over) after stale_after_s; its predictions continue from the last
# lateness through the reception gap until predict_without_data_s. Trains go without GPS longer.
stale_after_s = { default = 300, rail = 900 }
predict_without_data_s = { default = 1800, rail = 3600 }
arrival_radius_m = 60
departure_margin_m = 40
# A finished journey keeps its trip update (the calls it made) this long after its last call,
# so consumers do not revert it to the timetable; a lost one keeps its calls made until forgotten.
publish_finished_s = { default = 1800, rail = 3600 }
# Vehicles unseen and journeys untouched this long are dropped from memory (history keeps them).
forget_after_s = 7200

[progress]
# Map matching over the trip's path (BASE_PLAN.md 20.4, docs/R1_SLICE.md 9).
# Geometry trust: how far a fix may lie from the path, as one standard deviation.
gps_sigma_m = 20
shape_sigma_m = 25
chord_min_sigma_m = 80
chord_k = 0.15
# A chord is never trusted less than this: a road far from a long chord is explained by the
# off-path option below, not by a tolerance so wide that any fix fits anywhere along it.
chord_max_sigma_m = 300
# Segments further than this many sigmas from a fix give it no candidate.
reach_sigmas = 4
# Heading fit, only for fixes that carry a bearing; chords follow the road less closely.
bearing_sigma_deg = 45
chord_bearing_sigma_deg = 70
# Backward moves up to this are GPS noise (no movement); beyond, impossible.
jitter_m = 40
# Log-likelihood of a fix the geometry does not explain (detour, road far from a chord): the
# reading holds as if the fix were missing. About a fix at the reach (4.4 sigma) of a short chord.
off_path_log_p = -13
max_speed_mps = { default = 30, rail = 45 }
# Change of lateness between fixes: spread = base + rate x seconds elapsed. Losing time is
# common (traffic, dwell), gaining it is limited. Absolute lateness is never penalised.
loss_sigma_base_s = 120
loss_sigma_rate = 0.5
gain_sigma_base_s = 60
gain_sigma_rate = 0.2
# Prior for the first fix of a journey (also mid-trip after a restart): broad for lateness,
# narrow for early running, so a route through its own start (or past the layover stand) is
# not read as the vehicle being half an hour ahead.
start_lateness_sigma_s = 900
start_early_sigma_s = 120
beam = 8
# Hypotheses this far (log-likelihood) below the best are dropped.
prune = 15
# An open decision is forced (best hypothesis wins) after this long.
# A commit needs the agreement of every hypothesis within this of the best (log-likelihood);
# below it (e.g. a reading holding through one off-path fix) it is negligible and does not block.
agree_within = 7
max_commit_lag_s = 900
# A crossing bracketed by fixes further apart than this was not observed: no event, the call
# is passed without realtime (e.g. inside a reception gap).
max_event_interval_s = 300
off_route_hold_s = 180
# Two roads of about the same length differ in where they go, not how far: the distance driven
# is the measure of progress where a shape misses the road taken.
# On a real shape, a reading may not advance much less than the fixes moved apart (the shortest
# road between them): a shortfall beyond move_slack_m (GPS error at both fixes) costs a normal
# term with move_sigma_m. Without it a fix on a parallel road projects onto the shape where the
# roads split and stays there while time passes, read as lateness. A held reading (off a real
# shape) advances by the distance the fixes moved, never into the next call's arrival trigger
# (events come from fixes on the path); coming back onto the path it may step back by
# reckon_slack of what it advanced so. On a stop-to-stop chord the leg estimate is used instead. Both only between two fixes of one source (a run fuses DÚK GPS and the SŽ
# map). Measured on the 2026-10-12 morning peak (DPMD, MPV net, SŽ map; `--quality`).
move_sigma_m = 15
move_slack_m = 50
reckon_slack = 0.25

[prediction]
# Propagation (BASE_PLAN.md 20.5). A late vehicle recovers time only in a real timetabled dwell
# (departure after arrival): it needs min_dwell_s there, or min_long_dwell_s in a dwell of at
# least long_dwell_s, and never leaves before the scheduled departure. Early running carries
# over only once observed (a vehicle standing at a stop ahead of time is waiting, not running
# early), and a predicted departure from a passenger stop is at most max_early_departure_s
# ahead of the timetable: trains wait for their time (an observed early departure stays as it
# is). Road vehicles are not limited (a day): whether a bus waits is a habit of particular stops.
min_dwell_s = { default = 60 }
long_dwell_s = { default = 300 }
min_long_dwell_s = { default = 120 }
max_early_departure_s = { default = 86400, rail = 0 }
# A stop the timetable gives no dwell (arrival = departure, whole minutes) still has one inside
# the minute. Time a vehicle is seen standing there, up to dwell_credit_s, is not lateness: while
# it stands, and on the next leg, fading out by the next stop (the leg's time absorbs it). Most
# road stops are request stops, so only an observed stop counts; a train certainly stops at a
# call not on request. Measured on the 2026-10-12 morning peak (DPMD, MPV net, SŽ map;
# `obehy rt replay --quality`): 20 s and 45 s were no better.
dwell_credit_s = { default = 30 }
# An early lead holds to the next call; at each call beyond, this share of it is kept. Early
# vehicles mostly lose their lead within a call or two (2026-10-12 MPV net, buses predicted more
# than a minute early: next call -94 s predicted / -86 s actual, two calls on -91 / -32 s). Of
# 0.3, 0.4 and 0.5 on the 2026-10-12 morning peak, 0.5 cost DPMD least for the same MPV net gain.
early_keep = { default = 0.5 }

[delay]
discard_below_s = -1800

[warm_replay]
# What a restart replays: "vehicles" the stored observations of the vehicles still live (seen
# within lifecycle.forget_after_s plus the clock skew), each from where its state begins, and
# every observation of the journeys they and station boards are on; "window" everything.
# Either way at most the last max_hours.
mode = "vehicles"
max_hours = 6

[emit]
tick_s = 10
# The worker loads static data lazily, per key as observations name it. Every
# `sweep_index_every_s` it drops the data of keys no observation named in `keep_index_s` that no
# live journey needs, and once a day at `compact_index_at_s` (local seconds after midnight) it
# rebuilds the index from the live journeys alone. Dropped data reloads when named again.
sweep_index_every_s = 3600
keep_index_s = 14400
compact_index_at_s = 12600

[retention]
# Daily rt.observation partitions (UTC days) older than this are dropped by `obehy jobs nightly`.
# Only warm replay reads them (the last `warm_replay.max_hours`); delay history and vehicle
# tours live in history.*, which is rebuilt from the raw archive, not from here. A day of all
# sources is several GB.
observation_days = 2
# Raw archive day directories (data/rt-raw/<source>/<channel>/<UTC day>) older than this are
# deleted by the same job. Inside the window history can be rebuilt by replay; outside it is
# kept as recorded. Pinned corpora are copies elsewhere and stay. All sources together are about
# 1 GB a day with PID (BASE_PLAN.md section 18.4 plans 3 months; the server disk fits 2 weeks).
raw_days = 14

[egress]
# Proxy pools of channels that declare an egress (SŽ; docs/R2_SLICE.md section 7).
refresh_s = 21600
# A proxy refused (403/407/429) or unreachable stays out of rotation this long.
cooldown_s = 1800

[rail]
# Several sources on one run (docs/R2_SLICE.md section 5; the order applies on every feed). DÚK
# GPS leads the position while fresh, then PID; SŽ positions refresh only every few minutes and
# are coarse.
position_preference = ["duk", "pid", "sz-mapa"]
position_fresh_s = 120
position_sigma_m = { default = 20, "sz-mapa" = 150 }
# SŽ point events are minutes; a crossing from positions further outside loses to them.
event_tolerance_s = 60
# Forward prediction for runs with an SŽ prediction: anchor_change, sz or propagate. Chosen from
# the replay's predictor report (docs/R2_SLICE.md section 11, item 5).
predictor = "anchor_change"

[boards]
# SŽ station boards, read on demand per station (docs/R2_SLICE.md section 7). One read covers
# about 20 arrivals and 20 departures; platforms appear about an hour ahead.
min_boarding_points = 2
window_min = 60
due_refresh_s = 900
# Measured on the 2026-10-06 timetable at noon (900 stations): refreshing every 5 min near a
# train and every 2 min just before it would want ~118 reads a minute; these settings ~64.
early_min = 45
near_min = 15
near_refresh_s = 600
imminent_min = 5
imminent_refresh_s = 300
# About one person with SŽ's map open (its UI made ~57 requests a minute).
ceiling_per_min = 60
slowdown_s = 900
slow_latency_factor = 2.0

[keyless]
# Keyless inference (BASE_PLAN.md 19.2, `infer/keyless`; first source Arriva Express). Candidates
# are the line's trips to the destination whose schedule, widened by candidate_window_s, covers
# the observation. Evidence: each departure seen as a next-stop change, against the candidate's
# scheduled departure from the call before (median residual); before any, the position's
# timetable time on the candidate's path within max_path_distance_m. The best candidate binds
# when its residual is at most accept_s (gps_accept_s for a position alone) and the runner-up's
# is at least margin_s larger; otherwise ambiguous. Express trips run about hourly.
candidate_window_s = 1800
episode_gap_s = 1800
accept_s = 180
gps_accept_s = 600
margin_s = 900
max_path_distance_m = 300
# A departure counts as time evidence only if the vehicle was this close to the stop it left
# when the name changed (ARRIVA-Q9: the name can stay on a stop long after leaving it).
departure_radius_m = 2000
# Stop events go to history once the vehicle has left this many stops of the bound trip, in
# order (times are not compared: the source's delay is stale between stops, ARRIVA-Q10).
confirm_departures = 2
