# The realtime worker in Rust (docs/RUST_PORT.md). Three crates, dependencies pointing one way:
# obehy-rt -> obehy-sources -> obehy-core. Only obehy-rt may use tokio, a database driver or
# HTTP; `obehy-rt/tests/dependency_direction.rs` enforces it from Cargo.lock.
[workspace]
resolver = "3"
members = ["obehy-core", "obehy-sources", "obehy-rt"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "GPL-3.0-only"
publish = false

[workspace.dependencies]
obehy-core = { path = "obehy-core" }
obehy-sources = { path = "obehy-sources" }

clap = { version = "4.6", features = ["derive"] }
indexmap = "2.14"
# A fast hasher for maps whose iteration order does not depend on it (IndexMap keeps insertion
# order) or that are never iterated.
rustc-hash = "2.1"
# Time zones only: Europe/Prague is read from the TZif file Python's `tzdata` ships
# (obehy-core/tzdata/), never from a bundled or system database (see obehy-core/src/time/zone.rs).
jiff = { version = "1.0", default-features = false, features = ["std"] }
regex = "1.13"
serde = { version = "1.0", features = ["derive"] }
# float_roundtrip: parse floats correctly rounded, as Python's json does.
serde_json = { version = "1.0", features = ["float_roundtrip"] }
thiserror = "2.0"
# preserve_order: tables keep document order, as tomllib's dicts do (request headers).
toml = { version = "1.2", features = ["preserve_order"] }
# R3, the index (obehy-rt only): PostgreSQL `static.*` and a release's serving Parquet.
arrow-array = "60.1"
arrow-schema = "60.1"
bytes = "1.12"
parquet = { version = "60.1", default-features = false, features = ["arrow", "snap"] }
stats_alloc = "0.1.10"
tokio = { version = "1.54", features = ["rt", "macros"] }
tokio-postgres = "0.7.18"
# R2, the connectors: GTFS-RT alerts (obehy-sources); the archive's zstd objects and gzip
# compare streams (obehy-rt).
prost = { version = "0.14", default-features = false, features = ["derive", "std"] }
zstd = "0.13"
flate2 = "1.1"
# R8, the I/O shell (obehy-rt only): HTTP/1.1 with rustls and no automatic decompression (the
# runtime decodes gzip itself, as Python does), the archive's sha256 names.
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
hyper = "1"
sha2 = "0.11"
# Thread CPU time per worker phase (phases.py's `time.thread_time()`).
cpu-time = "1.0"
# R7/R8, the store and the lookup broker (obehy-rt only): binary COPY streams, pipelined
# statements, LISTEN notifications.
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# R8, the worker's periodic summary: resident memory on Windows and Linux.
memory-stats = "1.2"
# R7, the memory soak: an allocator that returns memory, chosen by the soak (`--features
# mimalloc`; docs/RUST_PORT.md "Memory").
mimalloc = { version = "0.1.52", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
