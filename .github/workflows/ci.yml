name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_DB: obehy_test
          POSTGRES_USER: obehy
          POSTGRES_PASSWORD: obehy-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U obehy -d obehy_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      OBEHY_TEST_DATABASE_URL: postgresql://obehy:obehy-ci@localhost:5432/obehy_test
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
