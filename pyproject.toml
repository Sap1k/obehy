[project]
name = "obehy"
version = "0.1.0"
description = "Czech public-transport static feed builds and publication"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "psycopg[binary]>=3.3,<4",
  "pyarrow>=25,<26",
  "rich>=14,<15",
  "shapely>=2.1,<3",
  "zstandard>=0.23,<1",
]

[project.scripts]
obehy = "obehy.cli:main"
obehy-national-jdf = "obehy.national_jdf:main"
obehy-national-czptt = "obehy.national_czptt:main"
obehy-osm = "obehy.osm_snapshot:main"

[dependency-groups]
dev = [
  "import-linter>=2.15",
  "pyarrow-stubs>=20,<21",
  "pyright>=1.1.403,<2",
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/obehy"]

[tool.hatch.build.targets.wheel.force-include]
"src/obehy/data/post-inference" = "obehy/data/post-inference"
"src/obehy/data/regional-gtfs-overlay" = "obehy/data/regional-gtfs-overlay"
"src/obehy/data/realtime" = "obehy/data/realtime"
"src/obehy/data/serving" = "obehy/data/serving"

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
markers = ["postgres: needs OBEHY_TEST_DATABASE_URL (skipped without it)"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "DTZ"]

[tool.ruff.lint.per-file-ignores]
# Legacy replay path, removed with the realtime core (docs/R1_SLICE.md).
"src/obehy/realtime/decode.py" = ["DTZ"]
"tests/unit/test_rt_replay.py" = ["DTZ"]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "strict"
include = ["src", "tests"]
exclude = ["converters"]

[tool.importlinter]
root_package = "obehy"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "The realtime core is pure: no database, network, filesystem services or connectors"
type = "forbidden"
source_modules = [
    "obehy.realtime.model",
    "obehy.realtime.index",
    "obehy.realtime.geo",
    "obehy.realtime.times",
]
forbidden_modules = [
    "psycopg",
    "urllib",
    "asyncio",
    "obehy.release",
    "obehy.pipeline",
    "obehy.realtime.archive",
    "obehy.realtime.record",
]
