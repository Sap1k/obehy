# The official texts of the source codes features come from, by system.
# JDF fixed codes: the Tabulka pevných kódů (Ministerstvo dopravy, JDF 1.11, Metodický pokyn
# č. 5, příloha 2), verbatim; `trip` is the text for a trip or its calls, `location` for a stop.
[source_codes.jdf]
"X" = "jede v pracovních dnech"
"+" = "jede v neděli a ve státem uznané svátky"
"1" = "jede v pondělí"
"2" = "jede v úterý"
"3" = "jede ve středu"
"4" = "jede ve čtvrtek"
"5" = "jede v pátek"
"6" = "jede v sobotu"
"7" = "jede v neděli"
"R" = "k jízdence je možné zakoupit místenku"
"#" = "spoj je možné použít jen s místenkou"
"|" = "spoj zastávkou projíždí"
"<" = "spoj jede po jiné trase"
"@" = { trip = "spoj s bezbariérově přístupným vozidlem", location = "bezbariérově přístupná zastávka" }
"%" = { trip = "spoj s možností občerstvení", location = "občerstvení nebo restaurace v objektu zastávky" }
"W" = "veřejné WC v objektu zastávky"
"w" = "veřejné WC s bezbariérovým přístupem v objektu zastávky"
"x" = { trip = "spoj zastavuje jen na znamení nebo požádání", location = "zastávka jen na znamení nebo požádání" }
"~" = "zastávka s možností přestupu na městskou hromadnou dopravu"
"(" = { trip = "spoj zastavuje jen pro vystupování", location = "zastávka jen pro výstup" }
")" = { trip = "spoj zastavuje jen pro nastupování", location = "zastávka jen pro nástup" }
"$" = "na hraničním přechodu není zřízena zastávka pro výstup a nástup cestujících"
"{" = "spoj s částečně bezbariérově přístupným vozidlem, nutná dopomoc průvodce"
"}" = "zastávka upravená pro osoby s těžkým zrakovým postižením"
"[" = "spoj přepravuje cestovní zavazadla"
