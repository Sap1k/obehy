# The Oběhy server: PostGIS, the realtime worker, hourly release updates, nightly jobs and
# nginx serving the feeds over plain HTTP to your reverse proxy. Put POSTGRES_PASSWORD
# (URL-safe) and optionally OBEHY_HTTP_PORT (8080), OBEHY_TAG and GITHUB_TOKEN in .env next to
# this file.
name: obehy

x-app: &app
  image: ghcr.io/sap1k/obehy:${OBEHY_TAG:-latest}
  restart: unless-stopped
  environment:
    OBEHY_DATABASE_URL: postgresql://obehy:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/obehy
    GITHUB_TOKEN: ${GITHUB_TOKEN:-}
  volumes:
    - data:/app/data
  depends_on:
    migrate:
      condition: service_completed_successfully

services:
  db:
    image: postgis/postgis:17-3.5
    restart: unless-stopped
    environment:
      POSTGRES_DB: obehy
      POSTGRES_USER: obehy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U obehy -d obehy"]
      interval: 5s
      timeout: 3s
      retries: 30
    volumes:
      - pgdata:/var/lib/postgresql/data

  migrate:
    <<: *app
    restart: "no"
    command: ["db", "migrate"]
    depends_on:
      db:
        condition: service_healthy

  # Hourly: fetch, load and activate the newest build release.
  release:
    <<: *app
    entrypoint: ["sh", "-c", "while :; do /app/deploy/obehy-release-update || echo 'release update failed' >&2; sleep 3600; done"]

  # Exits until a release is active; restarts until the first release update has run.
  realtime:
    <<: *app
    command: ["realtime"]

  jobs:
    <<: *app
    entrypoint: ["/app/deploy/obehy-nightly"]

  # Plain HTTP for the reverse proxy in front, which terminates TLS (deploy/nginx.conf).
  web:
    image: nginx:1.30-alpine
    restart: unless-stopped
    ports:
      - "${OBEHY_HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - data:/srv:ro

volumes:
  data:
  pgdata:
