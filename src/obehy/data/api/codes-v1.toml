# Readable forms of the static timetable codes (BASE_PLAN.md section 30): the JDF fixed codes
# (pevné kódy) and CZPTT KADR codes that JrUtil types into `assignment.kind`, the calendar
# designations, GTFS boarding codes and the integrated transport systems. Versioned like the
# limits: a change of meaning is a new file. `icon` is a stable key for the frontend's icon set.
codes_version = "1"

# A feature is one source code as the timetable states it, read with its official text (the
# tables at the end): a JDF fixed code, a CZPTT central note or a CZPTT train activity. JrUtil
# types a code into one or more kinds (CZPTT note 28: bicycle_transport, bicycle_carry_on,
# bicycle_reservation_available); the kinds drive the amenities, and give a feature its group,
# icon and English label. `en` is our wording; the Czech texts are official.
[kinds]
note = { group = "note", icon = "note", en = "Note" }
calendar_designation = { group = "calendar", icon = "calendar", en = "Days of operation" }
reservation_available = { group = "reservation", icon = "reservation", en = "Seat reservation available" }
reservation_required = { group = "reservation", icon = "reservation_required", en = "Seat reservation required" }
wheelchair_accessible_vehicle = { group = "accessibility", icon = "wheelchair", en = "Wheelchair-accessible vehicle" }
partly_wheelchair_accessible_vehicle = { group = "accessibility", icon = "wheelchair_partly", en = "Partly accessible vehicle, assistance needed" }
wheelchair_booking_required = { group = "accessibility", icon = "wheelchair_booking", en = "Wheelchair space must be booked" }
wheelchair_booking_recommended = { group = "accessibility", icon = "wheelchair_booking", en = "Wheelchair space booking recommended" }
refreshments_on_vehicle = { group = "onboard", icon = "refreshments", en = "Refreshments on board" }
luggage_transport = { group = "onboard", icon = "luggage", en = "Carries luggage" }
bicycle_transport = { group = "bicycles", icon = "bicycle", en = "Carries bicycles" }
bicycle_carry_on = { group = "bicycles", icon = "bicycle", en = "Bicycles as accompanied luggage" }
bicycle_storage = { group = "bicycles", icon = "bicycle", en = "Bicycles in the luggage van" }
bicycle_reservation_available = { group = "bicycles", icon = "bicycle_reservation", en = "Bicycle space can be reserved" }
bicycle_reservation_required = { group = "bicycles", icon = "bicycle_reservation", en = "Bicycle space reservation required" }
bicycle_transport_prohibited = { group = "bicycles", icon = "bicycle_none", en = "No bicycles" }
on_request = { group = "operation", icon = "on_request", en = "Runs only on request" }
conditional = { group = "operation", icon = "conditional", en = "Runs only under the conditions noted" }
self_service_ticketing = { group = "onboard", icon = "ticket", en = "Self-service ticketing" }
integrated_transport = { group = "integrated_transport", icon = "integrated", en = "Part of an integrated transport system" }
not_stopping = { group = "stopping", icon = "not_stopping", en = "Does not stop" }
diversion = { group = "operation", icon = "diversion", en = "Runs by another route" }
request_stop = { group = "stopping", icon = "request_stop", en = "Request stop" }
exit_only = { group = "stopping", icon = "exit_only", en = "Stops to set down only" }
boarding_only = { group = "stopping", icon = "boarding_only", en = "Stops to pick up only" }
wheelchair_accessible = { group = "facility", icon = "wheelchair", en = "Wheelchair-accessible stop" }
refreshments = { group = "facility", icon = "refreshments", en = "Refreshments at the stop" }
toilet = { group = "facility", icon = "toilet", en = "Public toilet at the stop" }
accessible_toilet = { group = "facility", icon = "toilet_accessible", en = "Accessible public toilet at the stop" }
urban_transport_interchange = { group = "interchange", icon = "interchange_city", en = "Interchange with city transport" }
border_control_only = { group = "stopping", icon = "border", en = "Border crossing with passport and customs control; not a stop for passengers" }
visually_impaired_accessible = { group = "facility", icon = "visually_impaired", en = "Stop adapted for the visually impaired" }
accessibility_terminal = { group = "facility", icon = "accessibility_point", en = "Terminal for the visually impaired" }
rail_interchange = { group = "interchange", icon = "interchange_rail", en = "Interchange with rail" }
line_interchange = { group = "interchange", icon = "interchange_line", en = "Interchange with regional buses" }
metro_interchange = { group = "interchange", icon = "interchange_metro", en = "Interchange with metro" }
ship_terminal = { group = "interchange", icon = "ship", en = "Interchange with boats" }
airport_nearby = { group = "interchange", icon = "airport", en = "Airport nearby" }
park_and_ride = { group = "facility", icon = "park_and_ride", en = "Park and ride" }

# JDF calendar designations: the days a trip runs, as printed (JDF 1.11, verbatim). The
# calendar itself is already compiled into the service dates; these are for display.
[calendar]
"X" = { cs = "jede v pracovních dnech", en = "runs on working days" }
"+" = { cs = "jede v neděli a ve státem uznané svátky", en = "runs on Sundays and public holidays" }
"1" = { cs = "jede v pondělí", en = "runs on Mondays" }
"2" = { cs = "jede v úterý", en = "runs on Tuesdays" }
"3" = { cs = "jede ve středu", en = "runs on Wednesdays" }
"4" = { cs = "jede ve čtvrtek", en = "runs on Thursdays" }
"5" = { cs = "jede v pátek", en = "runs on Fridays" }
"6" = { cs = "jede v sobotu", en = "runs on Saturdays" }
"7" = { cs = "jede v neděli", en = "runs on Sundays" }

