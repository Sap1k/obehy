# DPMD (Děčín city buses) vehicle map (docs/sources/dpmd.md). `v` is a cache buster (DPMD-Q9);
# the filter keeps the vehicles in service as JSON, which the connector decodes. Live on jdf
# since 2026-10-12, after a day of capture replayed clean.
source = "dpmd"
manifest_version = 1
# The public feed list (obehy release feed-list) names the source by these.
title = "DPMD vehicle map (Děčín)"
covers = "Děčín city buses (DPMD): positions and delays."

[[channel]]
name = "vehicles"
poll = { kind = "interval", seconds = 10 }
backoff = { after_failures = 5, max_s = 300 }
timeout_s = 8
filter = "dpmd"
feeds = ["jdf"]
live_feeds = ["jdf"]
capabilities = ["vehicle_key", "trip_key", "position", "delay"]
semantics = { clock = "source", delay_reference = "unknown", key_namespaces = { jdf = "cis:line_trip" } }

[channel.request]
method = "GET"
url = "https://tabla.dpmdas.cz/data/TrafficState.js?v={epoch_ms}"
headers = { accept-encoding = "gzip" }
