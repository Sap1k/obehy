# Serves the feeds from the data volume over plain HTTP to the reverse proxy in front, which
# owns TLS and the hostname. Every feed has a stable name under /get-feeds/, served from the
# active release (data/releases/active) or the worker's output; the list page and feeds.json
# come from `obehy release feed-list`. /api/ goes to the API service; everything else is the web
# app, baked into this image at /usr/share/nginx/obehy (web/Dockerfile).

# The map asks for vehicles by fixed grid cells (web/src/features/map/grid.ts), so every viewer
# asks for the same URLs: one answer per cell serves them all for the API's 5 s (its
# X-Accel-Expires; browsers are told no-cache, so they never draw an older answer again).
proxy_cache_path /var/cache/nginx/vehicles levels=1:2 keys_zone=vehicles:4m max_size=64m
    inactive=1m use_temp_path=off;

server {
    listen 80;
    server_tokens off;

    # About 100 Mbit/s per download (bytes per second).
    limit_rate 12500k;

    gzip on;
    gzip_types application/json application/problem+json application/x-protobuf text/css
        application/javascript image/svg+xml;

    # try_files, not alias: for a URI ending in "/" nginx would append index.html to the alias
    # and fail with a 500 on the not-a-directory path.
    location = /get-feeds/ {
        root /srv/public;
        try_files /index.html =404;
        add_header Cache-Control "no-cache";
    }
    location = /get-feeds/feeds.json {
        alias /srv/public/feeds.json;
        add_header Cache-Control "no-cache";
    }
    location = /get-feeds/cz-jdf-gtfs.zip {
        alias /srv/releases/active/jdf/gtfs.zip;
    }
    location = /get-feeds/cz-jdf-filtered-gtfs.zip {
        alias /srv/releases/active/jdf-filtered/gtfs.zip;
    }
    location = /get-feeds/cz-czptt-gtfs.zip {
        alias /srv/releases/active/czptt/gtfs.zip;
    }
    location = /get-feeds/cz-jdf-gtfs-rt.pb {
        alias /srv/gtfs-rt/jdf.pb;
        default_type application/x-protobuf;
        add_header Cache-Control "no-cache";
    }
    location = /get-feeds/cz-czptt-gtfs-rt.pb {
        alias /srv/gtfs-rt/czptt.pb;
        default_type application/x-protobuf;
        add_header Cache-Control "no-cache";
    }
    # The API sets its own Cache-Control; JSON answers are small, so no download cap.
    location = /api/v1/vehicles {
        limit_rate 0;
        proxy_cache vehicles;
        proxy_cache_key $request_uri;
        proxy_cache_lock on;
        proxy_cache_use_stale updating;
        add_header X-Cache-Status $upstream_cache_status;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/ {
        limit_rate 0;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # The web app: hashed assets forever, index.html always revalidated; any other path is a
    # route of the app (/odjezdy/...), answered with index.html.
    location /assets/ {
        root /usr/share/nginx/obehy;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location / {
        root /usr/share/nginx/obehy;
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
