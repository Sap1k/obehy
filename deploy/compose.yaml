# The Oběhy server: PostGIS, the realtime worker, hourly release updates, nightly jobs, the API
# and nginx serving the feeds and the API over plain HTTP to your reverse proxy. Put
# POSTGRES_PASSWORD (URL-safe), SYSTEM_RAM_GB (the host's RAM in whole GB) and optionally OBEHY_HTTP_PORT (8080),
# OBEHY_API_WORKERS (4), OBEHY_TAG and GITHUB_TOKEN in .env next to this file. SŽ is polled only through a proxy list: save it as secrets/sz-proxies.txt here
# (gitignored) and set OBEHY_EGRESS_SZ_PROXY_LIST_FILE=/app/secrets/sz-proxies.txt in .env. PID is
# polled only with a Golemio API key: OBEHY_SECRET_GOLEMIO in .env. The private DÚK vehicle
# register, saved as secrets/duk-register.csv, is imported by the jobs service at start and
# nightly (deploy/obehy-nightly).
name: obehy

x-app: &app
  image: ghcr.io/sap1k/obehy:${OBEHY_TAG:-latest}
  restart: unless-stopped
  environment:
    OBEHY_DATABASE_URL: postgresql://obehy:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/obehy
    GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    OBEHY_EGRESS_SZ_PROXY_LIST_FILE: ${OBEHY_EGRESS_SZ_PROXY_LIST_FILE:-}
    OBEHY_SECRET_GOLEMIO: ${OBEHY_SECRET_GOLEMIO:-}
  volumes:
    - data:/app/data
    - ./secrets:/app/secrets:ro
  depends_on:
    migrate:
      condition: service_completed_successfully

services:
  db:
    image: postgis/postgis:17-3.5
    restart: unless-stopped
    environment:
      POSTGRES_DB: obehy
      POSTGRES_USER: obehy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      SYSTEM_RAM_GB: ${SYSTEM_RAM_GB:?set SYSTEM_RAM_GB in .env}
    # Sized from the host's RAM: about half goes to the database (an eighth as shared buffers,
    # the rest as the OS cache it counts on), the other half to the worker, the jobs and the OS.
    # JIT only slows the worker's short lookups. random_page_cost and effective_io_concurrency
    # assume an SSD. The worker writes every tick: a larger WAL and spread checkpoints keep that
    # from stalling the API's reads, and autovacuum wakes often for the rt.*_current tables it
    # rewrites. pg_stat_statements and the slow-statement log are for tuning
    # (SELECT * FROM pg_stat_statements ORDER BY total_exec_time DESC).
    shm_size: 256m
    entrypoint:
      - sh
      - -c
      - |
        mb=$$(($${SYSTEM_RAM_GB} * 1024))
        exec docker-entrypoint.sh postgres \
          -c jit=off \
          -c shared_buffers=$$((mb / 8))MB \
          -c effective_cache_size=$$((mb / 2))MB \
          -c maintenance_work_mem=$$((mb / 16))MB \
          -c work_mem=16MB \
          -c random_page_cost=1.1 \
          -c effective_io_concurrency=200 \
          -c max_wal_size=4GB \
          -c checkpoint_timeout=15min \
          -c wal_compression=on \
          -c autovacuum_naptime=15s \
          -c autovacuum_vacuum_cost_limit=2000 \
          -c shared_preload_libraries=pg_stat_statements \
          -c pg_stat_statements.track=top \
          -c track_io_timing=on \
          -c log_min_duration_statement=250ms
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U obehy -d obehy"]
      interval: 5s
      timeout: 3s
      retries: 30
    volumes:
      - pgdata:/var/lib/postgresql/data

  migrate:
    <<: *app
    restart: "no"
    command: ["db", "migrate"]
    depends_on:
      db:
        condition: service_healthy

  # Hourly: fetch, load and activate the newest build release.
  release:
    <<: *app
    entrypoint: ["sh", "-c", "while :; do /app/deploy/obehy-release-update || echo 'release update failed' >&2; sleep 3600; done"]

  # Exits until a release is active; restarts until the first release update has run.
  realtime:
    <<: *app
    command: ["realtime"]

  jobs:
    <<: *app
    entrypoint: ["/app/deploy/obehy-nightly"]

  # The project API (BASE_PLAN.md section 30), behind nginx at /api/. Answers 503 until a
  # release is active. OBEHY_API_WORKERS (4) processes, each with up to 12 connections.
  api:
    <<: *app
    command:
      ["api", "serve", "--host", "0.0.0.0", "--port", "8000", "--workers", "${OBEHY_API_WORKERS:-4}"]

  # Plain HTTP for the reverse proxy in front, which terminates TLS (deploy/nginx.conf): the feeds,
  # the API and the web app, which is baked into this image (web/Dockerfile).
  web:
    image: ghcr.io/sap1k/obehy-web:${OBEHY_TAG:-latest}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${OBEHY_HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - data:/srv:ro

volumes:
  data:
  pgdata:
