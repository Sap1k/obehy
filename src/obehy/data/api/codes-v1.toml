# Readable forms of the static timetable codes (BASE_PLAN.md section 30): the JDF fixed codes
# (pevné kódy) and CZPTT KADR codes that JrUtil types into `assignment.kind`, the calendar
# designations, GTFS boarding codes and the integrated transport systems. Versioned like the
# limits: a change of meaning is a new file. `icon` is a stable key for the frontend's icon set.
codes_version = "1"

# assignment.kind -> group, Czech and English label, icon. Groups: accessibility, bicycles,
# reservation, onboard, operation (how the trip runs), stopping (a call), facility and
# interchange (a stop), calendar, note, integrated_transport.
[kinds]
note = { group = "note", cs = "Poznámka", en = "Note", icon = "note" }
calendar_designation = { group = "calendar", cs = "Jede", en = "Runs", icon = "calendar" }
reservation_available = { group = "reservation", cs = "Místenky", en = "Seat reservation available", icon = "reservation" }
reservation_required = { group = "reservation", cs = "Povinná místenka", en = "Seat reservation required", icon = "reservation_required" }
wheelchair_accessible_vehicle = { group = "accessibility", cs = "Vozidlo pro cestující na vozíku", en = "Wheelchair-accessible vehicle", icon = "wheelchair" }
partly_wheelchair_accessible_vehicle = { group = "accessibility", cs = "Částečně bezbariérové vozidlo", en = "Partly wheelchair-accessible vehicle", icon = "wheelchair_partly" }
wheelchair_booking_required = { group = "accessibility", cs = "Přepravu vozíku nutno objednat", en = "Wheelchair space must be booked", icon = "wheelchair_booking" }
wheelchair_booking_recommended = { group = "accessibility", cs = "Přepravu vozíku doporučeno objednat", en = "Wheelchair space booking recommended", icon = "wheelchair_booking" }
refreshments_on_vehicle = { group = "onboard", cs = "Občerstvení ve vozidle", en = "Refreshments on board", icon = "refreshments" }
luggage_transport = { group = "onboard", cs = "Přeprava zavazadel", en = "Luggage carried", icon = "luggage" }
bicycle_transport = { group = "bicycles", cs = "Přeprava jízdních kol", en = "Bicycles carried", icon = "bicycle" }
bicycle_carry_on = { group = "bicycles", cs = "Kolo jako spoluzavazadlo", en = "Bicycles as hand luggage", icon = "bicycle" }
bicycle_storage = { group = "bicycles", cs = "Úschovna kol ve vlaku", en = "Bicycle storage on board", icon = "bicycle" }
bicycle_reservation_available = { group = "bicycles", cs = "Místo pro kolo lze rezervovat", en = "Bicycle space can be reserved", icon = "bicycle_reservation" }
bicycle_reservation_required = { group = "bicycles", cs = "Povinná rezervace místa pro kolo", en = "Bicycle space reservation required", icon = "bicycle_reservation" }
bicycle_transport_prohibited = { group = "bicycles", cs = "Přeprava kol vyloučena", en = "No bicycles", icon = "bicycle_none" }
on_request = { group = "operation", cs = "Na znamení nebo objednávku", en = "On request", icon = "on_request" }
conditional = { group = "operation", cs = "Jede za podmínky", en = "Runs conditionally", icon = "conditional" }
self_service_ticketing = { group = "onboard", cs = "Samoobslužný odbavovací systém", en = "Self-service ticketing", icon = "ticket" }
integrated_transport = { group = "integrated_transport", cs = "Integrovaná doprava", en = "Integrated transport", icon = "integrated" }
not_stopping = { group = "stopping", cs = "Nezastavuje", en = "Does not stop", icon = "not_stopping" }
diversion = { group = "operation", cs = "Jede odklonem", en = "Diverted", icon = "diversion" }
request_stop = { group = "stopping", cs = "Zastávka na znamení", en = "Request stop", icon = "request_stop" }
exit_only = { group = "stopping", cs = "Jen pro výstup", en = "Exit only", icon = "exit_only" }
boarding_only = { group = "stopping", cs = "Jen pro nástup", en = "Boarding only", icon = "boarding_only" }
wheelchair_accessible = { group = "facility", cs = "Bezbariérově přístupné", en = "Wheelchair accessible", icon = "wheelchair" }
refreshments = { group = "facility", cs = "Občerstvení", en = "Refreshments", icon = "refreshments" }
toilet = { group = "facility", cs = "WC", en = "Toilet", icon = "toilet" }
accessible_toilet = { group = "facility", cs = "Bezbariérové WC", en = "Accessible toilet", icon = "toilet_accessible" }
urban_transport_interchange = { group = "interchange", cs = "Přestup na MHD", en = "Interchange with city transport", icon = "interchange_city" }
border_control_only = { group = "stopping", cs = "Jen pohraniční kontrola", en = "Border control only", icon = "border" }
visually_impaired_accessible = { group = "facility", cs = "Přístupné pro nevidomé", en = "Accessible for the visually impaired", icon = "visually_impaired" }
accessibility_terminal = { group = "facility", cs = "Kontaktní místo pro bezbariérovou přepravu", en = "Accessibility assistance point", icon = "accessibility_point" }
rail_interchange = { group = "interchange", cs = "Přestup na vlak", en = "Interchange with rail", icon = "interchange_rail" }
