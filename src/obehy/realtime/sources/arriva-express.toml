# Arriva bus positions (docs/sources/arriva-express.md). The endpoint returns Arriva's whole
# fleet and takes no arguments; the filter keeps only Arriva Express. No trip key: bound by
# keyless inference (`infer/keyless`). Live on jdf since 2026-10-12, after two captures replayed
# with every episode that shows a departure bound to its trip.
source = "arriva-express"
manifest_version = 1
# The public feed list (obehy release feed-list) names the source by these.
title = "Arriva Express bus positions"
covers = "Arriva Express long-distance buses: positions and delays. The source has no trip key; trips are inferred from line, destination and position."

[[channel]]
name = "buses"
poll = { kind = "interval", seconds = 30 }
backoff = { after_failures = 5, max_s = 300 }
timeout_s = 25
filter = "arriva-express"
feeds = ["jdf"]
live_feeds = ["jdf"]
capabilities = ["vehicle_key", "line_ref", "destination", "next_stop", "position", "delay"]

[channel.semantics]
delay_floor_minute = true  # ARRIVA-Q3

[channel.request]
method = "POST"
url = "https://www.arriva.cz/api/graphql"
body = '[{"query":"query busesCurrentLocation { busesCurrentLocations { angle delay destinationName lastStopName latitude longitude linkNumber state type mainType spz updated linkNumberAlias } }","operationName":"busesCurrentLocation","variables":{}}]'

[channel.request.headers]
content-type = "application/json"
x-enviroment = "client"
origin = "https://www.arriva.cz"
referer = "https://www.arriva.cz/cs/dopravni-info/aktualni-poloha-autobusu-online"

# How the archived batch becomes facts (Rust worker; docs/RUST_PORT.md "Config-driven sources").
[channel.decode]
version = 2
reader = "json"
root = "array"
non_empty = true
entities = "0.data.busesCurrentLocations"
errors = { root = "payload is not a GraphQL batch", entities = "payload lacks busesCurrentLocations" }
keep = { main_type = "ARRIVA EXPRESS" }  # ARRIVA-Q7 (the recorder filter keeps only these too)
feed = "jdf"
observed_at = { value = "updated", fresh = true }
fact = [
  { t = "vehicle_key", id = "{plate}" },
  { t = "vehicle_attribute", a = "licence_plate", value = "plate" },
  { t = "line_ref", ns = "cis:line", value = "{line}" },
  { t = "destination", name = "destination" },
  { t = "next_stop_name", name = "next" },
  { t = "position", lat = "lat", lon = "lon", bearing = "bearing?", zero_is_none = true, needs_time = true },
  { t = "delay", s = "delay", scale = 60, ref = "departure" },  # ARRIVA-Q3
]

[channel.decode.values]
main_type = { path = "mainType", as = "raw" }
plate = { path = "spz", as = "trimmed", required = true }  # ARRIVA-Q5
line = { path = "linkNumber", as = "trimmed", required = true }
destination = { path = "destinationName", as = "trimmed", required = true }
next = { path = "lastStopName", as = "trimmed" }  # ARRIVA-Q2
updated = { path = "updated", as = "iso_local_digits" }  # ARRIVA-Q1
lat = { path = "latitude", as = "number" }
lon = { path = "longitude", as = "number" }
bearing = { path = "angle", as = "number" }
delay = { path = "delay", as = "integer" }
