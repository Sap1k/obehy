# The Oběhy server: PostGIS, the realtime worker, hourly release updates, nightly jobs and
# Caddy in front of the GTFS-RT output. Put POSTGRES_PASSWORD (URL-safe), OBEHY_DOMAIN and
# optionally OBEHY_TAG and GITHUB_TOKEN in .env next to this file.
name: obehy

x-app: &app
  image: ghcr.io/sap1k/obehy:${OBEHY_TAG:-latest}
  restart: unless-stopped
  environment:
    OBEHY_DATABASE_URL: postgresql://obehy:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/obehy
    GITHUB_TOKEN: ${GITHUB_TOKEN:-}
  volumes:
    - data:/app/data
  depends_on:
    migrate:
      condition: service_completed_successfully

services:
  db:
    image: postgis/postgis:17-3.5
    restart: unless-stopped
    environment:
      POSTGRES_DB: obehy
      POSTGRES_USER: obehy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U obehy -d obehy"]
      interval: 5s
      timeout: 3s
      retries: 30
    volumes:
      - pgdata:/var/lib/postgresql/data

  migrate:
    <<: *app
    restart: "no"
    command: ["db", "migrate"]
    depends_on:
      db:
        condition: service_healthy

  # Hourly: fetch, load and activate the newest build release.
  release:
    <<: *app
    entrypoint: ["sh", "-c", "while :; do /app/deploy/obehy-release-update || echo 'release update failed' >&2; sleep 3600; done"]

  # Exits until a release is active; restarts until the first release update has run.
  realtime:
    <<: *app
    command: ["realtime"]

  jobs:
    <<: *app
    entrypoint: ["/app/deploy/obehy-nightly"]

  caddy:
    image: caddy:2.10
    restart: unless-stopped
    environment:
      OBEHY_DOMAIN: ${OBEHY_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - data:/srv:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  data:
  pgdata:
  caddy-data:
  caddy-config:
